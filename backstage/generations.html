<style>
.sp { display: inline-flex; flex-direction: column; justify-content: flex-start; width: 13px; height: var(--h); background: var(--p);
  margin: 0 2px 0 0; position: relative; vertical-align: bottom; text-decoration: none !important; transition: transform .16s cubic-bezier(.3,1.4,.6,1), opacity .2s; }
.sp i { display: block; width: 100%; box-shadow: 0 1px 0 var(--mat); }
.sp u { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; box-shadow: 0 -1px 0 var(--mat); }
.sp:hover { transform: translateY(-4px); }
.row { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--grid-major); }
.cn { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 2px; }
.spines { display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: 6px; }
.sec { margin-top: 64px; }
.lab { display: flex; align-items: baseline; gap: 12px; font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.lab b { font: 750 34px/1 var(--display); font-stretch: 86%; color: var(--ink); letter-spacing: 0; }
.poster { display: block; width: 100%; height: auto; }
.flow { display: flex; align-items: center; gap: 10px; font: 500 12px var(--mono); color: var(--ink-2); margin: 4px 0 14px; }
.flow .sw { width: 13px; height: 22px; display: inline-block; }
.rl { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 40px; }
.rl li { break-inside: avoid; display: grid; grid-template-columns: 54px 150px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--grid-major); font-size: 14px; color: var(--ink-2); }
.rl .d, .rl .id { font: 500 11px/1.9 var(--mono); color: var(--muted); } .rl .id { color: var(--ink); }
.four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; margin-top: 34px; }
.four a.card { text-decoration: none; display: block; }
.four .poster { aspect-ratio: 3 / 4; object-fit: cover; }
.four .meta { display: flex; justify-content: space-between; margin-top: 10px; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.four .meta span:first-child { color: var(--ink); }
.counts { margin-top: 12px; display: grid; gap: 6px; }
.counts div { display: grid; grid-template-columns: 1fr 34px; gap: 8px; align-items: center; font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.counts .bar { height: 8px; display: block; margin-top: 3px; }
</style>
