<script>
(() => {   // hover a room: the rooms it opens onto are lit too
  const D = [["paper", "compose"], ["compose", "drawing"], ["drawing", "foundry"], ["foundry", "proof"], ["proof", "plates"], ["proof", "press"], ["compose", "press"], ["press", "bindery"], ["bindery", "dispatch"], ["studio", "paper"], ["studio", "press"], ["handpress", "studio"], ["handpress", "press"], ["reading", "handpress"], ["reading", "gallery"], ["gallery", "press"], ["gallery", "desk"], ["desk", "press"], ["desk", "founding"], ["founding", "press"], ["founding", "dispatch"]];
  const rooms = document.querySelectorAll('.planta .room');
  rooms.forEach(r => { r.addEventListener('pointerenter', () => { const id = r.dataset.room;
      const nb = new Set(D.filter(d => d.includes(id)).flat()); rooms.forEach(o => o.classList.toggle('near', o !== r && nb.has(o.dataset.room))); });
    r.addEventListener('pointerleave', () => rooms.forEach(o => o.classList.remove('near'))); });
})();
</script>
